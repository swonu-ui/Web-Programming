<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .palette {
      display: flex;
      gap: 12px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
    }
    .swatch {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 13px;
      font-family: monospace;
      flex-shrink: 0;
    }
    .c1 { background-color: #FD8A8A; }
    .c2 { background-color: #FFCBCB; }
    .c3 { background-color: #9EA1D4; }
    .c4 { background-color: #F1F7B5; }
    .c5 { background-color: #A8D1D1; }
  </style>
</head>
<body>
  <div class="palette">
    <div class="swatch c1">#FD8A8A</div>
    <div class="swatch c2">#FFCBCB</div>
    <div class="swatch c3">#9EA1D4</div>
    <div class="swatch c4">#F1F7B5</div>
    <div class="swatch c5">#A8D1D1</div>
  </div>
</body>
</html>
