
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeopleGram | Random Profiles</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafafa;
      color: #262626;
    }

    header {
      padding: 35px 20px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #ddd;
      border-top: 6px solid transparent;
      border-image: linear-gradient(
        90deg, #ffd600, #ff7a00, #ff0169, #d300c5, #7638fa
      ) 1;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff7a00, #ff0169, #7638fa);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      display: inline-block;
    }

    header p {
      color: #737373;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      width: 92%;
      margin: 30px auto;
    }

    .controls {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: end;
      padding: 22px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 15px;
    }

    .field {
      flex: 1;
      min-width: 140px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    button {
      padding: 13px 22px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(45deg, #ff0169, #7638fa);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px 0 18px;
    }

    .heading h2 {
      font-size: 21px;
    }

    #user-count {
      color: #737373;
      font-size: 13px;
    }

    .profiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .profile-card {
      padding: 23px 18px;
      text-align: center;
      background: white;
      border: 1px solid #ddd;
      border-radius: 15px;
      transition: 0.2s;
      min-width: 0;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px #7638fa20;
    }

    .avatar-ring {
      width: 115px;
      height: 115px;
      padding: 4px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: linear-gradient(
        45deg, #ffd600, #ff7a00, #ff0169, #d300c5, #7638fa
      );
    }

    .avatar {
      width: 100%;
      height: 100%;
      border: 3px solid white;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
    }

    .profile-card h3 {
      font-size: 18px;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .location {
      color: #737373;
      font-size: 13px;
    }

    .details {
      text-align: left;
      border-top: 1px solid #eee;
      margin-top: 18px;
      padding-top: 12px;
    }

    .detail {
      margin: 12px 0;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .detail-label {
      display: block;
      color: #888;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .email {
      color: #9b35d5;
    }

    .message {
      grid-column: 1 / -1;
      padding: 40px 15px;
      text-align: center;
      color: #737373;
      background: white;
      border: 1px dashed #ddd;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .error {
      color: #d9304f;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .profiles {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      .profiles {
        grid-template-columns: 1fr;
      }

      .controls button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">PeopleGram</div>
    <p>Discover random people, one profile at a time.</p>
  </header>

  <main>

    <section class="controls">

      <div class="field">
        <label for="how-many">Number of users</label>

        <select id="how-many">
          <option value="3">3 users</option>
          <option value="6" selected>6 users</option>
          <option value="9">9 users</option>
          <option value="12">12 users</option>
        </select>
      </div>

      <div class="field">
        <label for="gender">Gender</label>

        <select id="gender">
          <option value="all">All genders</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
      </div>

      <button id="load-btn" type="button">
        ✦ Load Users
      </button>

    </section>

    <div class="heading">
      <h2>Explore People</h2>
      <span id="user-count">Ready to discover</span>
    </div>

    <section class="profiles" id="profiles">
      <div class="message">
        Loading profiles...
      </div>
    </section>

  </main>

  <footer>
    Profile data provided by Random User API
  </footer>

  <script>

    // STEP 1: Select HTML elements

    const loadButton = document.querySelector("#load-btn");

    const profilesContainer =
      document.querySelector("#profiles");

    const countLabel =
      document.querySelector("#user-count");


    // STEP 2: Listen for button clicks

    loadButton.addEventListener("click", loadUsers);


    // STEP 3: Fetch random users from the API

    async function loadUsers() {

      const amount =
        document.querySelector("#how-many").value;

      const gender =
        document.querySelector("#gender").value;

      // Build the API URL

      const params = new URLSearchParams();

      params.set("results", amount);

      params.set(
        "inc",
        "gender,name,location,email,dob,phone,picture"
      );

      if (gender !== "all") {
        params.set("gender", gender);
      }

      const url =
        `https://randomuser.me/api/1.4/?${params.toString()}`;

      // Show loading information

      loadButton.disabled = true;

      loadButton.textContent = "Loading...";

      countLabel.textContent = "Fetching data...";

      profilesContainer.replaceChildren();

      showMessage("Connecting to Random User API...");

      try {

        // Send an HTTP request to the API

        console.log("Requesting:", url);

        const response = await fetch(url);

        // Check whether the request succeeded

        if (!response.ok) {
          throw new Error(
            `HTTP error: ${response.status}`
          );
        }

        // Convert JSON response into JavaScript data

        const data = await response.json();

        console.log("Received JSON:", data);

        // Get the array containing user profiles

        const users = data.results;

        if (!Array.isArray(users) || users.length === 0) {
          throw new Error("No user profiles were returned.");
        }

        // Remove the loading message

        profilesContainer.replaceChildren();

        // Create a card for every user

        users.forEach(function(user) {

          createProfile(user);

        });

        countLabel.textContent =
          `${users.length} profiles loaded successfully`;

      }

      catch (error) {

        console.error("API Error:", error);

        profilesContainer.replaceChildren();

        showMessage(
          `Could not fetch profiles: ${error.message}`,
          true
        );

        countLabel.textContent = "Failed to load profiles";

      }

      finally {

        loadButton.disabled = false;

        loadButton.textContent = "✦ Load Users";

      }

    }


    // STEP 4: Create an individual profile card

    function createProfile(user) {

      // Get information from the JSON object

      const fullName =
        `${user.name.first} ${user.name.last}`;

      const city =
        user.location.city;

      const country =
        user.location.country;

      const email =
        user.email;

      const phone =
        user.phone;

      const age =
        user.dob.age;

      const picture =
        user.picture.large;

      // Create the main card

      const card = document.createElement("article");

      card.className = "profile-card";


      // Create profile picture

      const ring = document.createElement("div");

      ring.className = "avatar-ring";

      const image = document.createElement("img");

      image.className = "avatar";

      image.src = picture;

      image.alt = `Profile photo of ${fullName}`;

      image.loading = "lazy";

      image.onerror = function() {
        image.alt = "Profile image unavailable";
      };

      ring.appendChild(image);


      // Create name

      const name = document.createElement("h3");

      name.textContent = fullName;


      // Create location

      const location = document.createElement("p");

      location.className = "location";

      location.textContent = `📍 ${city}, ${country}`;


      // Create details container

      const details = document.createElement("div");

      details.className = "details";


      // Add user information

      details.appendChild(
        makeDetail("Email", email, "email")
      );

      details.appendChild(
        makeDetail("Phone", phone)
      );

      details.appendChild(
        makeDetail("Age", `${age} years old`)
      );

      details.appendChild(
        makeDetail("Gender", user.gender)
      );


      // Put all elements inside the card

      card.append(
        ring,
        name,
        location,
        details
      );


      // Display card on the webpage

      profilesContainer.appendChild(card);

    }


    // STEP 5: Create reusable detail elements

    function makeDetail(labelText, valueText, extraClass = "") {

      const wrapper = document.createElement("div");

      wrapper.className = "detail";

      const label = document.createElement("span");

      label.className = "detail-label";

      label.textContent = labelText;

      const value = document.createElement("div");

      value.textContent = valueText;

      if (extraClass) {
        value.className = extraClass;
      }

      wrapper.append(label, value);

      return wrapper;

    }


    // STEP 6: Show loading and error messages

    function showMessage(message, isError = false) {

      const box = document.createElement("div");

      box.className = isError
        ? "message error"
        : "message";

      box.textContent = message;

      profilesContainer.replaceChildren(box);

    }


    // STEP 7: Automatically fetch users when page opens

    loadUsers();

  </script>

</body>
</html>
