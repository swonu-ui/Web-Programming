
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Little Library ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f8f5ff;
            color: #514568;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: #8b6bb5;
            font-size: 32px;
        }

        header p {
            color: #9d91ac;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 18px rgba(100, 75, 130, 0.10);
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 2px solid #e3d9f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #a584ca;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 12px;
            background: #a584ca;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8965b4;
        }

        h2 {
            color: #8b6bb5;
        }

        #message {
            color: #9d91ac;
            text-align: center;
            margin: 25px 0;
        }

        .book-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 22px;
        }

        .book-card {
            background: white;
            border-radius: 18px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(100, 75, 130, 0.10);
        }

        .book-card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #f5f0fc;
            border-radius: 10px;
        }

        .book-card h3 {
            color: #72558f;
            font-size: 17px;
        }

        .book-card p {
            color: #9d91ac;
            font-size: 13px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            color: #aa9db8;
            font-size: 13px;
            margin-top: 45px;
        }

        @media (max-width: 550px) {
            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>♡ My Little Library ♡</h1>
            <p>Find your next favorite book ✿</p>
        </header>

        <!-- Search Form -->
        <main>

            <form id="searchForm" class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Enter a book title or author..."
                    required
                >

                <button type="submit">Search ♡</button>

            </form>

            <!-- Search Results -->
            <section>
                <h2>📚 Search Results</h2>

                <p id="message">
                    Search for a book to get started!
                </p>

                <div id="bookResults" class="book-container">
                </div>
            </section>

        </main>

        <footer>
            Made with ♡ for book lovers
        </footer>

    </div>

    <script>

        // Select HTML elements
        const searchForm = document.querySelector("#searchForm");
        const searchInput = document.querySelector("#searchInput");
        const bookResults = document.querySelector("#bookResults");
        const message = document.querySelector("#message");

        // Listen for form submission
        searchForm.addEventListener("submit", async function(event) {

            // Stop the page from refreshing
            event.preventDefault();

            // Get the user's search text
            const searchText = searchInput.value.trim();

            // Display loading message
            message.textContent = "Searching for books... ♡";
            bookResults.innerHTML = "";

            try {

                // Request book information
                const response = await fetch(
                    `https://openlibrary.org/search.json?q=${encodeURIComponent(searchText)}&limit=12`
                );

                const data = await response.json();

                // Check whether books were found
                if (data.docs.length === 0) {
                    message.textContent = "No books found. Try another search!";
                    return;
                }

                message.textContent =
                    `Found ${data.docs.length} books!`;

                // Display each book
                data.docs.forEach(function(book) {

                    const card = document.createElement("div");
                    card.className = "book-card";

                    const image = document.createElement("img");

                    if (book.cover_i) {
                        image.src =
                            `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`;
                    } else {
                        image.src =
                            "https://placehold.co/200x280/eee8ff/7655a0?text=No+Cover";
                    }

                    image.alt = "Book cover";

                    const title = document.createElement("h3");
                    title.textContent = book.title || "Unknown Title";

                    const author = document.createElement("p");
                    author.textContent =
                        "Author: " +
                        (book.author_name
                            ? book.author_name[0]
                            : "Unknown");

                    const year = document.createElement("p");
                    year.textContent =
                        "Published: " +
                        (book.first_publish_year || "Unknown");

                    card.appendChild(image);
                    card.appendChild(title);
                    card.appendChild(author);
                    card.appendChild(year);

                    bookResults.appendChild(card);

                });

            } catch (error) {

                message.textContent =
                    "Something went wrong. Please try again.";

                console.error(error);

            }

        });

    </script>

</body>
</html>
