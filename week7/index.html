<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 7 Assignments</title>
  <style>
    :root {
      --bg: #fffaf5;
      --panel: #ffffff;
      --primary: #b03a77;
      --accent: #ffa5d6;
      --text: #3d2b35;
      --shadow: rgba(176, 58, 119, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fffaf5, #ffeef8);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    .container {
      width: min(720px, 100%);
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 18px;
      box-shadow: 0 18px 45px var(--shadow);
      padding: 32px 24px;
    }

    h1 {
      margin: 0 0 20px;
      color: var(--primary);
      text-align: center;
      font-size: clamp(2rem, 4vw, 2.8rem);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 14px;
    }

    li a {
      display: block;
      padding: 16px 18px;
      border-radius: 12px;
      text-decoration: none;
      background: #fff6fb;
      border: 1px solid #ffd1ea;
      color: var(--text);
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    li a:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 8px 18px rgba(176, 58, 119, 0.08);
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Week 7 Assignments</h1>
    <ul>
      <li><a href="booksearcher.html" target="_blank" rel="noopener noreferrer">Book Searcher</a></li>
      <li><a href="login.html" target="_blank" rel="noopener noreferrer">Login</a></li>
      <li><a href="registration.html" target="_blank" rel="noopener noreferrer">Registration</a></li>
      <li><a href="validation.html" target="_blank" rel="noopener noreferrer">Validation</a></li>
      <li><a href="studentregistration.html" target="_blank" rel="noopener noreferrer">Student Registration</a></li>
    </ul>
    <a class="back-link" href="../index.html">← Back to main index</a>
  </div>
</body>
</html>
