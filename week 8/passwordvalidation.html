
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autumn Create Account</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Georgia, serif;
    background: #F5EBDD;
    background-image: radial-gradient(#D9BFA3 1px, transparent 1px);
    background-size: 24px 24px;
    color: #4A2C20;
    padding: 40px 16px 48px;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }

  .decoration {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 8px;
    text-align: center;
    color: #A34F24;
  }

  p.sub {
    color: #87634C;
    margin-bottom: 24px;
    text-align: center;
    line-height: 1.6;
    font-size: 0.95rem;
  }

  form {
    background: #FFFAF3;
    border: 1px solid #E6CFB5;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 8px 25px rgba(105, 62, 35, 0.10);
  }

  label {
    display: block;
    font-size: 0.95rem;
    margin: 16px 0 8px;
    color: #68412D;
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 13px 14px;
    border: 2px solid #D8B99A;
    border-radius: 11px;
    font-size: 1rem;
    outline: none;
    background: #FFFDF9;
    color: #4A2C20;
    font-family: Georgia, serif;
    transition: 0.25s ease;
  }

  input:focus {
    border-color: #C16A35;
    box-shadow: 0 0 0 3px rgba(193, 106, 53, 0.15);
  }

  input.valid {
    border-color: #66834C;
    background: #F3F7EC;
  }

  input.invalid {
    border-color: #B94A35;
    background: #FFF1EC;
  }

  .requirements {
    font-size: 0.85rem;
    margin-top: 7px;
    color: #98745B;
  }

  .hint {
    font-size: 0.85rem;
    margin-top: 8px;
    display: none;
    color: #B13D2D;
  }

  .hint.show {
    display: block;
  }

  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 11px;
    background: #A34F24;
    color: #FFFAF3;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 22px;
    font-family: Georgia, serif;
    transition: 0.25s ease;
  }

  button:hover {
    background: #78391D;
  }

  button:focus-visible {
    outline: 3px solid #66834C;
    outline-offset: 3px;
  }

  #msg {
    margin-top: 16px;
    padding: 13px;
    border-radius: 10px;
    display: none;
    background: #EDF3E5;
    color: #587640;
    font-size: 0.9rem;
    text-align: center;
    line-height: 1.5;
  }

  .footer {
    text-align: center;
    margin-top: 24px;
    color: #98745B;
    font-size: 0.85rem;
  }

  .leaf {
    color: #A34F24;
  }

</style>
</head>

<body>

<div class="wrap">

  <div class="decoration">🍂 🍁 🎃</div>

  <h1>Create Your Account</h1>

  <p class="sub">
    A cozy little space just for you.
    Create a password to get started!
  </p>

  <form id="accountForm">

    <label for="password">
      🍁 Create Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Choose a password"
      autocomplete="new-password"
      aria-describedby="requirements"
      required
    >

    <p class="requirements" id="requirements">
      Your password must contain at least 8 characters.
    </p>

    <label for="confirm">
      🍂 Confirm Password
    </label>

    <input
      id="confirm"
      type="password"
      placeholder="Type the password again"
      autocomplete="new-password"
      aria-describedby="hint"
      required
    >

    <p class="hint" id="hint" aria-live="polite">
      Passwords do not match.
    </p>

    <button type="submit">
      Create Account ✨
    </button>

    <div id="msg" role="status" aria-live="polite"></div>

  </form>

  <p class="footer">
    <span class="leaf">✦</span>
    Made with autumn vibes and pumpkin spice
    <span class="leaf">✦</span>
  </p>

</div>

<script>

  const pw = document.getElementById('password');
  const cf = document.getElementById('confirm');
  const hint = document.getElementById('hint');
  const msg = document.getElementById('msg');

  // Check password length and matching
  function check() {

    const longEnough = pw.value.length >= 8;

    // Password validation
    pw.classList.toggle('valid', longEnough);

    pw.classList.toggle(
      'invalid',
      pw.value !== '' && !longEnough
    );

    // Confirm password validation
    const match =
      cf.value !== '' && cf.value === pw.value;

    cf.classList.toggle('valid', match);

    cf.classList.toggle(
      'invalid',
      cf.value !== '' && !match
    );

    // Show or hide mismatch message
    hint.classList.toggle(
      'show',
      cf.value !== '' && !match
    );

    // Hide previous success message when editing
    msg.style.display = 'none';

  }

  // Validate while typing
  pw.addEventListener('input', check);

  cf.addEventListener('input', check);

  // Form submission
  document.getElementById('accountForm')
    .addEventListener('submit', function(e) {

      e.preventDefault();

      if (
        pw.value.length >= 8 &&
        pw.value === cf.value
      ) {

        msg.style.display = 'block';

        msg.textContent =
          '🍂 Account created successfully! (Demo only)';

      } else {

        check();

        if (pw.value.length < 8) {
          pw.focus();
        } else {
          cf.focus();
        }

      }

    });

</script>
</body>
</html>
